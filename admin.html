<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RH//HUB ADMIN</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="section-head"><div><span class="eyebrow">RH//HUB // CONTROL</span><h2>ADMIN PANEL</h2></div><a class="btn" href="/">← PUBLIC SITE</a></div><div class="panel" style="padding:20px"><input id="key" placeholder="ADMIN KEY" style="background:#050906;border:2px solid #214d37;color:#fff;padding:14px;width:100%;font:12px 'Space Mono'"><button class="btn primary" style="margin-top:12px" onclick="load()">LOAD SUBMISSIONS</button></div><div id="out" style="margin-top:20px"></div></main><script>const $=id=>document.getElementById(id);async function load(){const key=$('key').value;const r=await fetch('/api/admin/projects',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok){$('out').innerHTML='<div class="panel" style="padding:20px;color:#ff5577">UNAUTHORIZED</div>';return}$('out').innerHTML=d.map(p=>`<div class="panel" style="padding:20px;margin:12px 0"><div class="eyebrow">${p.status.toUpperCase()}</div><h3 style="font-family:'Press Start 2P'">${p.name}</h3><p>${p.description||''}</p><p style="font-size:10px;color:#759482">${p.address} · ${p.category}</p><button class="btn primary" onclick="review('${p.id}','approved')">APPROVE</button> <button class="btn" onclick="review('${p.id}','rejected')">REJECT</button></div>`).join('')||'<div class="panel" style="padding:20px">NO SUBMISSIONS</div>'}async function review(id,status){const key=$('key').value;await fetch('/api/admin/projects/'+id,{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify({status})});load()}</script></body></html>
