<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copilot Admin</title><link rel="stylesheet" href="app.css"></head><body><header><a class="logo" href="/"><b>RH</b><span>ADMIN</span></a><span class="muted">PROJECT MODERATION</span></header><main class="section"><div class="section-title"><div><span class="kicker">PRIVATE CONSOLE</span><h2>PROJECT QUEUE</h2></div><button id="load" class="pixel-btn hot">LOAD</button></div><div id="queue" class="project-grid"></div></main><script>const q=s=>document.querySelector(s);let key='';q('#load').onclick=async()=>{key=prompt('Admin key');if(!key)return;load()};async function load(){const r=await fetch('/api/projects?status=all');const rows=await r.json();q('#queue').innerHTML=rows.map(p=>`<article class="project"><span class="tag">${p.status.toUpperCase()}</span><h3>${p.name}</h3><p>${p.description}</p><p class="muted">${p.contract||'No contract'}<br>${p.website||''}</p><button class="pixel-btn hot" onclick="act(${p.id},'approve')">APPROVE</button> <button class="pixel-btn" onclick="act(${p.id},'reject')">REJECT</button></article>`).join('')||'<div class="empty">NO SUBMISSIONS</div>'}async function act(id,a){const r=await fetch('/api/projects/'+id+'/'+a,{method:'POST',headers:{'x-admin-key':key}});if(r.ok)load();else alert('Unauthorized / failed')} </script></body></html>
